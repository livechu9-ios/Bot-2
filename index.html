<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UMA BOT CHAT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-wrap">
  <div class="chat-header">
    <div class="avatar">U</div>
    <div class="info">
      <h1>UMA BOT</h1>
      <p id="botStatus">Online</p>
    </div>
  </div>

  <div class="chat-body" id="chatBody"></div>

  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Nhập lệnh... /start" autocomplete="off" spellcheck="false">
    <button id="btnSend">GUI</button>
  </div>
</div>

<input type="file" id="fileInputChat" accept="*/*">
<a id="downloadLink" style="display:none"></a>

<script src="script.js"></script>
</body>
</html>
